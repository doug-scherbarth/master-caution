; Master Caution Annunciator — PlatformIO project config
;
; Two environments:
;   teensy41  — production firmware build for Teensy 4.1
;   host      — native build on Linux for Unity unit tests of portable logic
;
; Per-env build_src_filter excludes the wrong HAL impl from each build.

[platformio]
default_envs = teensy41

[env]
build_flags = -Wall -Wextra -Wpedantic -Wno-unused-parameter

[env:teensy41]
platform         = teensy
framework        = arduino
board            = teensy41
build_flags      = ${env.build_flags} -DAUDIO_BLOCK_SAMPLES=128
build_src_filter = +<*> -<hal_host/> -<pintest/>
monitor_speed    = 115200
upload_protocol  = teensy-cli

[env:host]
platform         = native
test_framework   = unity
; -lm needed for light_cfg (powf)
build_flags      = ${env.build_flags} -DHAL_HOST=1 -g -O0 -lm
build_src_filter = +<hal_host/> -<main.cpp> -<hal_teensy/>

[env:pintest]
platform         = teensy
framework        = arduino
board            = teensy41
build_src_filter = -<*> +<pintest/pintest.cpp>
monitor_speed    = 115200
upload_protocol  = teensy-cli

[env:ledtest]
platform         = teensy
framework        = arduino
board            = teensy41
build_src_filter = -<*> +<pintest/ledtest.cpp>
upload_protocol  = teensy-cli

[env:wstest]
platform         = teensy
framework        = arduino
board            = teensy41
build_src_filter = -<*> +<pintest/wstest.cpp>
upload_protocol  = teensy-cli

[env:audiotest]
platform         = teensy
framework        = arduino
board            = teensy41
build_flags      = ${env.build_flags} -DAUDIO_BLOCK_SAMPLES=128
build_src_filter = -<*> +<pintest/audiotest.cpp>
upload_protocol  = teensy-cli

[env:sdtest]
platform         = teensy
framework        = arduino
board            = teensy41
build_src_filter = -<*> +<pintest/sdtest.cpp>
upload_protocol  = teensy-cli
