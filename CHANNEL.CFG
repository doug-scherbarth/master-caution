; CHANNEL.CFG — per-channel alarm input configuration
; Copy this file to the SD card root as /CHANNEL.CFG
; Read once at boot. Changes take effect after a power cycle.
;
; FORMAT NOTES
; ------------
; Lines starting with ; or # are comments.
; Keys are case-insensitive. The [defaults] section applies to ALL channels.
; Named sections (e.g. [OIL_PRESS_LOW]) override individual channels.
; Section names match the channel names in the alarm table — case-insensitive.
; Unknown section names are silently ignored.
;
; KEYS
; ----
;   enabled          = yes | no       disable an unwired or always-false input
;   debounce_ms      = <integer>       qualification window in milliseconds
;   startup_excluded = yes | no        skip this channel in the power-up check

[defaults]
enabled          = yes
debounce_ms      = 500
startup_excluded = no

; OIL_PRESS_LOW is normally asserted on the ground before engine start.
; Excluding it prevents a false fault indication during the startup sweep.
[OIL_PRESS_LOW]
startup_excluded = yes

; --- Examples (remove the leading semicolons to activate) ---

; Disable an input that is not wired on your installation:
;[BOOST_PUMP_ON]
;enabled = no

; Tighten debounce for a fast mechanical switch:
;[FLAPS_DEPLOYED]
;debounce_ms = 250

; Stretch debounce to quiet a known-noisy connection:
;[AIRSPEED_OVER_VFE]
;debounce_ms = 1000
