; LIGHTS.CFG — WS2812B cabin/panel lighting configuration
; Copy this file to the root of the Teensy 4.1 SD card as /LIGHTS.CFG
;
; FORMAT NOTES
; ------------
; Lines starting with ; or # are comments and are ignored.
; Keys are case-insensitive.  Extra whitespace around = is ignored.
; There is one [global] section and up to 8 [config] sections.
; Within each [config], a new "start =" line begins a new segment
; (up to 4 segments per config).
; The active config index is saved to EEPROM addr 0 on change.
;
; DIMMER
; ------
; Brightness is driven ratiometrically: DIM_IN / BUS_SENSE (both 0-12 V).
; The ratio is gamma-corrected before scaling pixel values.
;
; CURRENT BUDGET
; --------------
; Estimated draw per frame:
;   est_mA = sum(R+G+B)/255 * mA_per_channel + n_pixels * quiescent_mA
; If est_mA > max_current_mA every channel is scaled down proportionally.
; Set max_current_mA conservatively for your wiring gauge and buck rating.

[global]
total_pixels    = 150       ; total pixels in the chain (hard limit: 150)
mA_per_channel  = 20        ; mA per R/G/B channel at full on (typical WS2812B)
quiescent_mA    = 1         ; mA per pixel when all channels are off
max_current_mA  = 3000      ; absolute current budget in mA (e.g. 3 A for 5 V/3 A supply)
gamma           = 2.2       ; perceptual gamma applied to dimmer ratio (1.0 = linear)
gesture_low_pct    = 20     ; dimmer % below which a dip gesture arms (0-100)
gesture_high_pct   = 80     ; dimmer % above which a bump gesture arms (0-100)
gesture_timeout_ms = 2000   ; ms to complete gesture before it cancels

; -----------------------------------------------------------------------
; CONFIG 0 — full cabin warm white
; All 150 pixels, warm white (R255 G220 B150), 100% scale.
; At full dimmer this draws about 150 * (625*20/255 + 1) ≈ 759 mA.
; -----------------------------------------------------------------------
[config]
name    = cabin_warm

start   = 0
count   = 150
r       = 255
g       = 220
b       = 150
scale   = 100

; -----------------------------------------------------------------------
; CONFIG 1 — split: forward cabin warm + aft cool white
; Example of two independent segments on one string.
; Adjust start/count to match your physical installation.
; -----------------------------------------------------------------------
[config]
name    = cabin_split

start   = 0
count   = 80
r       = 255
g       = 200
b       = 130
scale   = 100

start   = 80
count   = 70
r       = 220
g       = 220
b       = 255
scale   = 80

; -----------------------------------------------------------------------
; CONFIG 2 — dim red (preserve night vision)
; -----------------------------------------------------------------------
[config]
name    = night_red

start   = 0
count   = 150
r       = 255
g       = 0
b       = 0
scale   = 15

; -----------------------------------------------------------------------
; CONFIG 3 — off (all pixels dark, buck still enabled)
; -----------------------------------------------------------------------
[config]
name    = off

start   = 0
count   = 150
r       = 0
g       = 0
b       = 0
scale   = 0
