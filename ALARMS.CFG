; Master Caution Annunciator — per-channel alarm input configuration
; File: /ALARMS.CFG on the SD card.  Read once at boot.
;
; A missing file is not an error: compiled defaults apply silently.
; A bad or unreadable file triggers the CH_FAULT warning at startup
; (4 Hz blue flash for 3 s) because running on wrong polarity is dangerous.
;
; Per-key fallback: an unrecognised or out-of-range value keeps the compiled
; default for that key AND counts as a warning.  A file with any warnings
; triggers the CH_FAULT startup flash (same as a bad file), because the
; pilot needs to know the config was not applied as written.
;
; -----------------------------------------------------------------------
; [defaults]          applies to ALL channels before named overrides
; [CHANNEL_NAME]      overrides one channel (see channel_table.h for names)
;
; Keys (all case-insensitive; inline ; and # comments stripped from values):
;   active_high  = yes | no | true | false | 1 | 0
;                  (default: yes — DB-15 #1 inputs assert HIGH)
;   pull         = down | up | none
;                  (default: down — matches active-high wiring)
;   debounce_ms  = 50-5000
;                  (default: per-channel compiled value)
;   wav_id       = 0-12
;                  (default: compiled value — changes which sound plays, not the alarm
;                  severity or whether it annunciates; see alarm_table.h wav_id enum)
;
; NOT SD-configurable: alarm severity, composite logic, channel enables.
; A severity = key is treated as unknown and produces a warning — the alarm
; priority is compiled in and cannot be demoted or promoted via this file.
;
; WARNING: active_high and pull determine which switch state is an alarm.
; An incorrect polarity will suppress real alarms or create phantom ones.
; -----------------------------------------------------------------------

[defaults]
active_high = yes
pull        = down

; Example: NC contact that opens on fault (active-low)
;[FUEL_PRESS_LOW]
;active_high = no
;pull        = up

; Example: tighten debounce on a clean solid-state input
;[L_MAG_FAIL]
;debounce_ms = 100
