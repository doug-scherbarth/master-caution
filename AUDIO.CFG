; AUDIO.CFG — Master Caution audio configuration
; Copy this file to the root of the Teensy 4.1 SD card as /AUDIO.CFG
;
; A missing file is not an error: the compiled default gain applies.
; Values outside the valid range are clamped; non-numeric values keep the default.
;
; [global]
;   gain  — amplifier gain applied to both output channels (0.00 – 2.00, default 0.30)
;           0.00 = mute, 1.00 = unity gain, 2.00 = maximum
;           Tune this on the ramp with the engine at idle to match cockpit noise.

[global]
gain = 0.30
